name: Azilehub CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Validate Dev Kustomize
        run: |
          kubectl kustomize k8s/overlays/dev > /tmp/azilehub-dev.yaml

      - name: Validate Prod Kustomize
        run: |
          kubectl kustomize k8s/overlays/prod > /tmp/azilehub-prod.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------
      # Frontend
      # ----------------------------------------

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: azilehub-frontend:ci

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: azilehub-frontend:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      # ----------------------------------------
      # Content Service
      # ----------------------------------------

      - name: Build content-service image
        uses: docker/build-push-action@v6
        with:
          context: ./services/content-service
          file: ./services/content-service/Dockerfile
          push: false
          load: true
          tags: azilehub-content:ci

      - name: Scan content-service image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: azilehub-content:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'

      # ----------------------------------------
      # Contact Service
      # ----------------------------------------

      - name: Build contact-service image
        uses: docker/build-push-action@v6
        with:
          context: ./services/contact-service
          file: ./services/contact-service/Dockerfile
          push: false
          load: true
          tags: azilehub-contact:ci

      - name: Scan contact-service image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: azilehub-contact:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: '0'
      
      # ----------------------------------------
      # Docker Hub Login
      # ----------------------------------------

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------
      # Push images to Docker Hub
      # ----------------------------------------

      - name: Tag and push frontend image
        run: |
          docker tag azilehub-frontend:ci \
            ${{ vars.DOCKERHUB_USERNAME }}/azilehub-frontend:1.0.7

          docker push \
            ${{ vars.DOCKERHUB_USERNAME }}/azilehub-frontend:1.0.7

      - name: Tag and push content-service image
        run: |
          docker tag azilehub-content:ci \
            ${{ vars.DOCKERHUB_USERNAME }}/azilehub-content:1.0.1

          docker push \
            ${{ vars.DOCKERHUB_USERNAME }}/azilehub-content:1.0.1

      - name: Tag and push contact-service image
        run: |
          docker tag azilehub-contact:ci \
            ${{ vars.DOCKERHUB_USERNAME }}/azilehub-contact:1.0.1

          docker push \
            ${{ vars.DOCKERHUB_USERNAME }}/azilehub-contact:1.0.1
