apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: azilehub
  labels:
    app: frontend
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%

  template:
    metadata:
      labels:
        app: frontend

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101

      containers:
        - name: frontend
          image: zainul1114/azilehub-frontend:1.0.7
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: nginx-run
              mountPath: /run

            - name: nginx-cache
              mountPath: /var/cache/nginx

            - name: nginx-logs
              mountPath: /var/log/nginx

          livenessProbe:
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File

      volumes:
        - name: nginx-run
          emptyDir: {}

        - name: nginx-cache
          emptyDir: {}

        - name: nginx-logs
          emptyDir: {}

      restartPolicy: Always
      terminationGracePeriodSeconds: 30
