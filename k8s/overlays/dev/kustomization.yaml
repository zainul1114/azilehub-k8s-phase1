apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: azilehub

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2

  - target:
      kind: Deployment
      name: content-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: Deployment
      name: contact-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: HorizontalPodAutoscaler
      name: contact-service-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1

  - target:
      kind: HorizontalPodAutoscaler
      name: content-service-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1

images:
  - name: zainul1114/azilehub-frontend
    newTag: 1.0.7
  - name: zainul1114/azilehub-content
    newTag: 1.0.1
  - name: zainul1114/azilehub-contact
    newTag: 1.0.1
